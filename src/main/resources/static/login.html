<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智慧课堂 · 登录</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* 样式与您原先提供的完全一致，此处省略（实际使用请保留完整样式） */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Inter','Microsoft Yahei',system-ui,sans-serif; background:#080d1a; overflow:hidden; position:relative; }
        .bg { position:fixed; inset:0; z-index:0; background:radial-gradient(ellipse at 30% 40%, rgba(99,102,241,.25) 0%, transparent 55%), radial-gradient(ellipse at 70% 70%, rgba(139,92,246,.18) 0%, transparent 50%), radial-gradient(ellipse at 50% 20%, rgba(59,130,246,.10) 0%, transparent 40%), #080d1a; animation:drift 16s ease-in-out infinite alternate; }
        @keyframes drift { 0% { background:radial-gradient(ellipse at 30% 40%, rgba(99,102,241,.28) 0%, transparent 55%), radial-gradient(ellipse at 70% 70%, rgba(139,92,246,.20) 0%, transparent 50%), radial-gradient(ellipse at 50% 20%, rgba(59,130,246,.12) 0%, transparent 40%), #080d1a; } 100% { background:radial-gradient(ellipse at 70% 30%, rgba(99,102,241,.20) 0%, transparent 55%), radial-gradient(ellipse at 20% 80%, rgba(139,92,246,.28) 0%, transparent 50%), radial-gradient(ellipse at 60% 60%, rgba(59,130,246,.15) 0%, transparent 40%), #0b1120; } }
        #particleCanvas { position:fixed; inset:0; z-index:0; pointer-events:none; }
        .card { position:relative; z-index:1; display:flex; width:820px; max-width:94vw; min-height:480px; border-radius:32px; background:rgba(255,255,255,.03); backdrop-filter:blur(28px) saturate(1.5); -webkit-backdrop-filter:blur(28px) saturate(1.5); border:1px solid rgba(255,255,255,.06); box-shadow:0 40px 100px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.04); animation:rise .8s cubic-bezier(.16,1,.3,1) forwards; overflow:hidden; }
        @keyframes rise { 0% { opacity:0; transform:translateY(30px) scale(.97); } 100% { opacity:1; transform:translateY(0) scale(1); } }
        .brand { width:38%; padding:44px 36px; display:flex; flex-direction:column; justify-content:center; border-right:1px solid rgba(255,255,255,.04); background:radial-gradient(ellipse at 20% 50%, rgba(139,92,246,.08), transparent 60%); }
        .brand .logo { font-size:36px; font-weight:700; background:linear-gradient(135deg, #c4b5fd, #818cf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:-1px; margin-bottom:6px; }
        .brand .sub { font-size:13px; color:rgba(255,255,255,.3); letter-spacing:2px; margin-bottom:28px; }
        .brand .divider { width:32px; height:3px; background:linear-gradient(90deg, #8b5cf6, transparent); border-radius:4px; margin-bottom:24px; }
        .brand ul { list-style:none; display:flex; flex-direction:column; gap:10px; }
        .brand ul li { font-size:13px; color:rgba(255,255,255,.4); display:flex; align-items:center; gap:10px; transition:color .3s; }
        .brand ul li i { color:#8b5cf6; font-size:14px; width:18px; }
        .brand ul li:hover { color:rgba(255,255,255,.7); }
        .form { flex:1; padding:44px 40px; display:flex; flex-direction:column; justify-content:center; }
        .form h2 { font-size:22px; font-weight:600; color:#e2e8f0; margin-bottom:4px; }
        .form .hint { font-size:13px; color:rgba(255,255,255,.25); margin-bottom:28px; }
        .tip { display:none; padding:8px 14px; border-radius:10px; font-size:13px; text-align:center; margin-bottom:18px; backdrop-filter:blur(4px); background:rgba(239,68,68,.10); border:1px solid rgba(239,68,68,.15); color:#fca5a5; }
        .tip.ok { background:rgba(34,197,94,.10); border-color:rgba(34,197,94,.15); color:#86efac; }
        .field { position:relative; margin-bottom:20px; }
        .field input { width:100%; height:48px; padding:0 16px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07); border-radius:12px; font-size:14px; color:#f1f5f9; outline:none; transition:all .35s; font-family:inherit; }
        .field input:focus { border-color:rgba(139,92,246,.4); background:rgba(255,255,255,.06); box-shadow:0 0 0 4px rgba(139,92,246,.06); }
        .field input::placeholder { color:transparent; }
        .field label { position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:14px; color:rgba(255,255,255,.25); pointer-events:none; transition:all .3s; padding:0 4px; background:transparent; }
        .field input:focus~label, .field input:not(:placeholder-shown)~label { top:0; font-size:11px; color:#a78bfa; background:#0b1120; transform:translateY(-50%); padding:0 6px; border-radius:4px; }
        .field .line { position:absolute; bottom:0; left:50%; width:0; height:2px; background:linear-gradient(90deg, #6366f1, #a78bfa); border-radius:4px; transition:all .5s; transform:translateX(-50%); opacity:0; }
        .field input:focus~.line { width:50%; opacity:1; }
        .row { display:flex; align-items:center; gap:8px; margin-bottom:26px; font-size:13px; color:rgba(255,255,255,.3); }
        .row input[type="checkbox"] { width:15px; height:15px; accent-color:#8b5cf6; cursor:pointer; }
        .row label { cursor:pointer; user-select:none; }
        .btn { width:100%; height:48px; border:none; border-radius:14px; background:linear-gradient(135deg, #6366f1, #8b5cf6); color:#fff; font-size:15px; font-weight:600; cursor:pointer; transition:all .35s cubic-bezier(.25,.46,.45,.94); display:inline-flex; align-items:center; justify-content:center; gap:8px; position:relative; overflow:hidden; box-shadow:0 4px 24px rgba(99,102,241,.2); font-family:inherit; }
        .btn::after { content:''; position:absolute; inset:0; border-radius:14px; padding:2px; background:linear-gradient(135deg, #818cf8, #a78bfa, #818cf8); background-size:300% 300%; -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite:xor; mask-composite:exclude; animation:flow 4s ease-in-out infinite; opacity:0; transition:opacity .4s; }
        .btn:hover::after { opacity:1; }
        .btn:hover { transform:translateY(-2px); box-shadow:0 8px 36px rgba(99,102,241,.35); }
        .btn:active { transform:scale(.97); }
        .btn .loader { display:none; width:18px; height:18px; border:2.5px solid rgba(255,255,255,.2); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }
        .btn.loading .loader { display:inline-block; }
        .btn.loading .txt { opacity:.5; }
        .btn.loading { pointer-events:none; }
        @keyframes flow { 0%,100% { background-position:0% 50%; } 50% { background-position:100% 50%; } }
        @keyframes spin { to { transform:rotate(360deg); } }
        .footer { position:fixed; bottom:20px; left:0; width:100%; text-align:center; font-size:11px; color:rgba(255,255,255,.08); letter-spacing:.5px; z-index:1; pointer-events:none; }
        @media (max-width:768px) { .card { flex-direction:column; min-height:auto; border-radius:24px; max-height:94vh; overflow-y:auto; } .brand { width:100%; padding:28px 24px; border-right:none; border-bottom:1px solid rgba(255,255,255,.04); align-items:center; text-align:center; } .brand .divider { margin:16px auto 20px; } .brand ul { flex-direction:row; flex-wrap:wrap; justify-content:center; gap:8px 16px; } .form { padding:28px 24px; } .form h2 { font-size:20px; } }
        @media (max-width:420px) { .brand { padding:20px 16px; } .brand .logo { font-size:28px; } .form { padding:20px 16px; } .field input { height:42px; font-size:13px; } .btn { height:42px; font-size:14px; } }
    </style>



</head>
<body>
<div class="bg"></div>
<canvas id="particleCanvas"></canvas>

<div class="card">
    <div class="brand">
        <div class="logo">✦智慧课堂✦</div>
        <div class="sub">高效 · 稳定 · 智能</div>
        <div class="divider"></div>
        <ul>
            <li><i class="fas fa-chart-line"></i> 成绩分析</li>
            <li><i class="fas fa-file-alt"></i> 趋势报告</li>
            <li><i class="fas fa-users"></i> 班级管理</li>
        </ul>
    </div>
    <div class="form">
        <h2>欢迎回来</h2>
        <p class="hint">登录账号和密码</p>
        <div class="tip" id="tip"></div>
        <div class="field">
            <input type="text" id="user" placeholder=" " />
            <label>用户名</label>
            <span class="line"></span>
        </div>
        <div class="field">
            <input type="password" id="pwd" placeholder=" " />
            <label>密码</label>
            <span class="line"></span>
        </div>
        <div class="row">
            <input type="checkbox" id="remember" />
            <label for="remember">记住账号</label>
        </div>
        <button class="btn" id="loginBtn">
            <span class="txt">登 录</span>
            <span class="loader"></span>
        </button>
    </div>
</div>

<div class="footer">© 2026 智慧课堂管理系统</div>

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>



    // ─── 粒子系统（保持不变） ───
    (function() {
        const c = document.getElementById('particleCanvas'), ctx = c.getContext('2d');
        let W, H, parts = [];
        const N = 60, D = 120, R = 140;
        let m = { x: null, y: null };
        function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
        addEventListener('resize', resize);
        resize();
        class P {
            constructor() { this.x = Math.random() * W; this.y = Math.random() * H; this.vx = (Math.random() - .5) * .3; this.vy = (Math.random() - .5) * .3; this.r = Math.random() * 2 + .8; this.o = Math.random() * .4 + .15; }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > W) this.vx *= -1;
                if (this.y < 0 || this.y > H) this.vy *= -1;
                if (m.x !== null) {
                    const dx = m.x - this.x, dy = m.y - this.y, dist = Math.hypot(dx, dy);
                    if (dist < R) { const f = (R - dist) / R * .01; this.vx += dx * f; this.vy += dy * f; const s = Math.hypot(this.vx, this.vy); if (s > .6) { this.vx = this.vx / s * .6; this.vy = this.vy / s * .6; } }
                }
            }
            draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fillStyle = `rgba(167,139,250,${this.o})`; ctx.fill(); }
        }
        for (let i = 0; i < N; i++) parts.push(new P());
        addEventListener('mousemove', e => { m.x = e.clientX; m.y = e.clientY; });
        addEventListener('mouseleave', () => { m.x = null; m.y = null; });
        addEventListener('touchmove', e => { const t = e.touches[0]; m.x = t.clientX; m.y = t.clientY; }, { passive: true });
        addEventListener('touchend', () => { m.x = null; m.y = null; });
        function drawLines() {
            for (let i = 0; i < parts.length; i++) {
                for (let j = i + 1; j < parts.length; j++) {
                    const dx = parts[i].x - parts[j].x, dy = parts[i].y - parts[j].y, dist = Math.hypot(dx, dy);
                    if (dist < D) { ctx.beginPath(); ctx.moveTo(parts[i].x, parts[i].y); ctx.lineTo(parts[j].x, parts[j].y); ctx.strokeStyle = `rgba(167,139,250,${(1-dist/D)*.15})`; ctx.lineWidth = .6; ctx.stroke(); }
                }
            }
        }
        function anim() { ctx.clearRect(0, 0, W, H); for (const p of parts) { p.update(); p.draw(); } drawLines(); requestAnimationFrame(anim); }
        anim();
        addEventListener('resize', () => { resize(); for (const p of parts) { p.x = Math.random() * W; p.y = Math.random() * H; } });
    })();







    // ─── 登录逻辑（完全按照图片，仅跳转改为 index.html） ───
    const tip = document.getElementById('tip'),
        btn = document.getElementById('loginBtn');

    function showTip(msg, ok = false) {
        tip.textContent = msg;
        tip.style.display = 'block';
        tip.className = 'tip' + (ok ? ' ok' : '');
        clearTimeout(tip._t);
        tip._t = setTimeout(() => { tip.style.display = 'none'; }, 3500);
    }
    function hideTip() { tip.style.display = 'none'; }

    btn.addEventListener('click', function() {
        const uname = document.getElementById('user').value.trim();
        const password = document.getElementById('pwd').value.trim();
        if (!uname || !password) {
            showTip('请输入用户名和密码');
            return;
        }

        btn.classList.add('loading');
        btn.disabled = true;
        hideTip();

        $.ajax({
            url: "login",
            type: "POST",
            data: { uname: uname, password: password },
            success: function(result) {
                if (result == 0) {
                    alert("用户名或密码错误");
                } else {
                    localStorage.setItem("username", uname);
                    // 修改跳转地址为 index.html
                    location.href = "index.html";
                }
            },
            error: function() {
                alert("请求失败，请检查服务");
            },
            complete: function() {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        });
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !btn.disabled) btn.click();
    });
</script>
</body>
</html>
