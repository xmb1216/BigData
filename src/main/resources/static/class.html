<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级管理 · 智慧课堂</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 样式与 student.html 完全一致，此处复用，为节省篇幅省略重复样式 */
        /* 实际使用时请复制 student.html 中的 style 部分 */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: "Inter", "Microsoft Yahei", system-ui, sans-serif; min-height:100vh; background:#0b1120; color:#f1f5f9; overflow-x:hidden; position:relative; }
        .bg-gradient-layer { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; background:radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.25) 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.20) 0%, transparent 50%), radial-gradient(ellipse at 50% 80%, rgba(59,130,246,0.15) 0%, transparent 50%), #0b1120; animation:gradientFlow 18s ease-in-out infinite alternate; }
        @keyframes gradientFlow { 0% { background:radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.30) 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.25) 0%, transparent 50%), radial-gradient(ellipse at 50% 80%, rgba(59,130,246,0.20) 0%, transparent 50%), #0b1120; } 50% { background:radial-gradient(ellipse at 70% 40%, rgba(139,92,246,0.30) 0%, transparent 55%), radial-gradient(ellipse at 20% 70%, rgba(99,102,241,0.25) 0%, transparent 50%), radial-gradient(ellipse at 60% 10%, rgba(59,130,246,0.20) 0%, transparent 45%), #0f172a; } 100% { background:radial-gradient(ellipse at 40% 60%, rgba(59,130,246,0.30) 0%, transparent 55%), radial-gradient(ellipse at 10% 30%, rgba(139,92,246,0.25) 0%, transparent 50%), radial-gradient(ellipse at 80% 70%, rgba(99,102,241,0.20) 0%, transparent 50%), #0b1120; } }
        #particleCanvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events:none; }
        .layout { position:relative; z-index:2; display:flex; min-height:100vh; }
        .sidebar { width:230px; flex-shrink:0; background:rgba(255,255,255,0.04); backdrop-filter:blur(24px) saturate(1.4); -webkit-backdrop-filter:blur(24px) saturate(1.4); border-right:1px solid rgba(255,255,255,0.06); padding:24px 0 30px; display:flex; flex-direction:column; transition:backdrop-filter 0.4s; box-shadow:4px 0 40px rgba(0,0,0,0.3); }
        .sidebar:hover { backdrop-filter:blur(28px) saturate(1.6); }
        .sidebar-logo { padding:0 20px 24px; border-bottom:1px solid rgba(255,255,255,0.06); text-align:center; font-size:18px; font-weight:700; letter-spacing:0.5px; background:linear-gradient(135deg, #a78bfa, #6366f1); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; position:relative; }
        .sidebar-logo::after { content:''; position:absolute; bottom:-1px; left:30%; width:40%; height:2px; background:linear-gradient(90deg, transparent, #8b5cf6, transparent); border-radius:4px; }
        .menu-group { padding:16px 0 4px 20px; font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:rgba(255,255,255,0.25); font-weight:600; }
        .menu-item { display:flex; align-items:center; padding:12px 20px; margin:2px 12px; border-radius:10px; color:rgba(255,255,255,0.5); cursor:pointer; transition:all 0.35s cubic-bezier(0.25,0.46,0.45,0.94); text-decoration:none; font-size:14px; font-weight:500; background:transparent; border:none; }
        .menu-item i { width:22px; font-size:16px; margin-right:12px; transition:transform 0.3s; text-align:center; }
        .menu-item span { transition:transform 0.3s; }
        .menu-item:hover { background:rgba(139,92,246,0.15); color:#fff; transform:translateX(4px) scale(1.02); box-shadow:0 4px 20px rgba(139,92,246,0.10); }
        .menu-item:hover i { transform:scale(1.15) translateX(2px); }
        .menu-item:hover span { transform:translateX(2px); }
        .menu-item.active { background:rgba(139,92,246,0.18); color:#fff; box-shadow:inset 3px 0 0 #8b5cf6, 0 4px 20px rgba(139,92,246,0.08); }
        .menu-item.active i { color:#a78bfa; }
        .badge { margin-left:auto; background:rgba(139,92,246,0.2); padding:2px 10px; border-radius:20px; font-size:11px; color:#a78bfa; font-weight:600; }
        .main { flex:1; padding:28px 32px 40px; min-width:0; }
        .header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:16px; padding:16px 24px; background:rgba(255,255,255,0.04); backdrop-filter:blur(20px) saturate(1.3); -webkit-backdrop-filter:blur(20px) saturate(1.3); border-radius:16px; border:1px solid rgba(255,255,255,0.06); margin-bottom:32px; transition:box-shadow 0.4s, border-color 0.4s; box-shadow:0 8px 32px rgba(0,0,0,0.15); }
        .header:hover { border-color:rgba(139,92,246,0.15); box-shadow:0 8px 40px rgba(0,0,0,0.25); }
        .header-left { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
        .header-title { font-size:20px; font-weight:700; letter-spacing:-0.3px; background:linear-gradient(135deg, #e2e8f0, #94a3b8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .header-title i { -webkit-text-fill-color:initial; color:#8b5cf6; margin-right:8px; }
        .user-info { display:flex; align-items:center; gap:12px; font-size:14px; color:rgba(255,255,255,0.7); flex-wrap:wrap; }
        .user-avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg, #6366f1, #8b5cf6); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:15px; color:#fff; box-shadow:0 0 20px rgba(139,92,246,0.2); border:1px solid rgba(255,255,255,0.08); }
        .logout-btn { padding:7px 18px; border-radius:40px; border:none; font-size:13px; font-weight:500; color:#f1f5f9; cursor:pointer; background:linear-gradient(135deg, rgba(239,68,68,0.15), rgba(239,68,68,0.05)); border:1px solid rgba(239,68,68,0.15); transition:all 0.4s cubic-bezier(0.25,0.46,0.45,0.94); position:relative; overflow:hidden; font-family:inherit; display:inline-flex; align-items:center; gap:6px; }
        .logout-btn::before { content:''; position:absolute; inset:0; border-radius:40px; padding:2px; background:linear-gradient(135deg, #ef4444, #f97316, #ef4444); background-size:300% 300%; -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite:xor; mask-composite:exclude; animation:borderFlow 4s ease-in-out infinite; opacity:0; transition:opacity 0.4s; }
        .logout-btn:hover::before { opacity:1; }
        .logout-btn:hover { background:rgba(239,68,68,0.20); border-color:rgba(239,68,68,0.3); transform:translateY(-2px); box-shadow:0 8px 30px rgba(239,68,68,0.12); }
        .logout-btn:active { transform:scale(0.96); }
        .logout-btn .btn-loader { display:none; width:16px; height:16px; border:2px solid rgba(255,255,255,0.15); border-top-color:#f1f5f9; border-radius:50%; animation:spin 0.7s linear infinite; }
        .logout-btn.loading .btn-loader { display:inline-block; }
        .logout-btn.loading .btn-text { opacity:0.6; }
        @keyframes borderFlow { 0%,100% { background-position:0% 50%; } 50% { background-position:100% 50%; } }
        @keyframes spin { to { transform:rotate(360deg); } }
        .toolbar { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:24px; align-items:center; }
        .btn { height:40px; padding:0 20px; border:none; border-radius:10px; cursor:pointer; transition:all 0.3s cubic-bezier(0.25,0.46,0.45,0.94); color:#fff; font-size:14px; font-weight:500; display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.06); }
        .btn-primary { background:linear-gradient(135deg, #6366f1, #8b5cf6); border:none; }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(99,102,241,0.3); }
        .btn-danger { background:rgba(239,68,68,0.8); }
        .btn-edit { background:rgba(59,130,246,0.8); }
        .btn-cancel { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); }
        .btn-cancel:hover { background:rgba(255,255,255,0.15); }
        .table-box { background:rgba(255,255,255,0.03); backdrop-filter:blur(20px) saturate(1.2); -webkit-backdrop-filter:blur(20px) saturate(1.2); border-radius:16px; border:1px solid rgba(255,255,255,0.05); overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,0.10); transition:border-color 0.3s; }
        .table-box:hover { border-color:rgba(139,92,246,0.08); }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:14px 18px; text-align:left; border-bottom:1px solid rgba(255,255,255,0.06); font-size:14px; }
        th { background:rgba(139,92,246,0.06); font-weight:600; color:rgba(255,255,255,0.7); letter-spacing:0.3px; }
        tr:hover { background:rgba(255,255,255,0.03); }
        td .btn { height:28px; padding:0 12px; font-size:12px; border-radius:6px; }
        .modal-mask { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); backdrop-filter:blur(8px); z-index:999; align-items:center; justify-content:center; }
        .modal { width:460px; background:rgba(30,41,59,0.85); backdrop-filter:blur(32px) saturate(1.4); -webkit-backdrop-filter:blur(32px) saturate(1.4); border-radius:20px; padding:28px 32px; border:1px solid rgba(255,255,255,0.08); box-shadow:0 20px 60px rgba(0,0,0,0.5); max-height:85vh; overflow-y:auto; }
        .modal-title { font-size:20px; font-weight:600; margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid rgba(255,255,255,0.06); color:#e2e8f0; }
        .form-item { margin-bottom:18px; }
        .form-item label { display:block; margin-bottom:8px; font-size:14px; color:rgba(255,255,255,0.7); font-weight:500; }
        .form-item input { width:100%; height:44px; padding:0 14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:#f1f5f9; outline:none; transition:all 0.3s; font-size:14px; }
        .form-item input:focus { border-color:rgba(139,92,246,0.5); background:rgba(255,255,255,0.07); box-shadow:0 0 0 4px rgba(139,92,246,0.08); }
        .modal-footer { display:flex; justify-content:flex-end; gap:12px; margin-top:24px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.06); }
        @media (max-width:820px) { .sidebar { width:70px; padding:16px 0; } .sidebar-logo { font-size:0; padding:0 0 16px; } .sidebar-logo::after { display:none; } .menu-group { display:none; } .menu-item { padding:12px 0; justify-content:center; margin:2px 6px; } .menu-item span { display:none; } .menu-item i { margin:0; font-size:18px; } .badge { display:none; } .main { padding:16px; } .header { padding:14px 18px; flex-direction:column; align-items:stretch; } .header-left { flex-wrap:wrap; } }
        @media (max-width:480px) { .modal { width:95%; padding:20px; } }
    </style>
</head>
<body>
<div class="bg-gradient-layer"></div>
<canvas id="particleCanvas"></canvas>
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-logo">✦智慧课堂管理系统✦</div>
        <div class="menu-group">导航</div>
        <a href="/index" class="menu-item"><i class="fas fa-home"></i><span>系统首页</span></a>
        <a href="student.html" class="menu-item"><i class="fas fa-user-graduate"></i><span>学生管理</span></a>
        <a href="class.html" class="menu-item active"><i class="fas fa-users"></i><span>班级管理</span></a>
        <a href="course.html" class="menu-item"><i class="fas fa-book"></i><span>课程管理</span></a>
        <a href="exam.html" class="menu-item"><i class="fas fa-file-alt"></i><span>考试管理</span></a>
        <a href="score.html" class="menu-item"><i class="fas fa-chart-bar"></i><span>成绩管理</span></a>
    </aside>
    <main class="main">
        <header class="header">
            <div class="header-left"><div class="header-title"><i class="fas fa-users"></i> 班级管理</div></div>
            <div class="user-info">

                <div class="user-avatar">A</div>
                <button class="logout-btn" id="logoutBtn" onclick="handleLogout()">
                    <span class="btn-text"><i class="fas fa-sign-out-alt"></i> 退出</span>
                    <span class="btn-loader"></span>
                </button>
            </div>
        </header>
        <div class="toolbar">
            <button class="btn btn-primary" onclick="openAddModal()"><i class="fas fa-plus"></i> 新增班级</button>
        </div>
        <div class="table-box">
            <table>
                <thead><tr><th>ID</th><th>入学年份</th><th>班级名称</th><th>操作</th></tr></thead>
                <tbody id="classTable"><tr><td colspan="4" style="text-align:center;color:rgba(255,255,255,.4);">加载中...</td></tr></tbody>
            </table>
        </div>
    </main>
</div>
<div class="modal-mask" id="modal">
    <div class="modal">
        <div class="modal-title" id="modalTitle">新增班级</div>
        <input type="hidden" id="editId">
        <div class="form-item"><label>入学年份</label><input type="number" id="gradeYear" placeholder="如 2024"></div>
        <div class="form-item"><label>班级名称</label><input type="text" id="className" placeholder="如 计算机1班"></div>
        <div class="modal-footer">
            <button class="btn btn-cancel" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveClass()"><i class="fas fa-save"></i> 保存</button>
        </div>
    </div>
</div>
<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
    // 粒子系统（同 student.html）
    (function initParticles() {
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        const COUNT = 55, CONNECT = 110, RADIUS = 140;
        let mouse = { x: null, y: null };
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        class Particle {
            constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - .5) * .25; this.vy = (Math.random() - .5) * .25; this.r = Math.random() * 2 + .8; this.o = Math.random() * .3 + .12; }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
                if (mouse.x !== null) {
                    const dx = mouse.x - this.x, dy = mouse.y - this.y, dist = Math.hypot(dx, dy);
                    if (dist < RADIUS) { const f = (RADIUS - dist) / RADIUS * .008; this.vx += dx * f; this.vy += dy * f; const s = Math.hypot(this.vx, this.vy); if (s > .5) { this.vx = this.vx / s * .5; this.vy = this.vy / s * .5; } }
                }
            }
            draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fillStyle = `rgba(167,139,250,${this.o})`; ctx.fill(); }
        }
        for (let i = 0; i < COUNT; i++) particles.push(new Particle());
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('touchmove', e => { const t = e.touches[0]; mouse.x = t.clientX; mouse.y = t.clientY; }, { passive: true });
        window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });
        function drawLines() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.hypot(dx, dy);
                    if (dist < CONNECT) { ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.strokeStyle = `rgba(167,139,250,${(1 - dist / CONNECT) * .12})`; ctx.lineWidth = .5; ctx.stroke(); }
                }
            }
        }
        function animate() { ctx.clearRect(0, 0, width, height); for (const p of particles) { p.update(); p.draw(); } drawLines(); requestAnimationFrame(animate); }
        animate();
        window.addEventListener('resize', () => { resize(); for (const p of particles) { p.x = Math.random() * width; p.y = Math.random() * height; } });
    })();

    function handleLogout() {
        const btn = document.getElementById('logoutBtn');
        if (btn.classList.contains('loading')) return;
        if (!confirm('确定退出登录吗？')) return;
        btn.classList.add('loading'); btn.disabled = true;
        setTimeout(() => { location.href = '/logout'; }, 1200);
    }

    $(function(){ loadClassList(); });

    // 使用 $.ajax 完整写法 —— 加载班级列表
    function loadClassList() {
        $.ajax({
            url: "/api/clazz/list",
            success: function(res) {
                if (res.length === 0) {
                    $("#classTable").html('<tr><td colspan="4" style="text-align:center;color:rgba(255,255,255,.4);">暂无数据</td></tr>');
                    return;
                }
                var html = '';
                for (var i = 0, len = res.length; i < len; i++) {
                    var item = res[i];
                    html += '<tr><td>' + item.id + '</td><td>' + item.gradeYear + '</td><td>' + item.className + '</td><td><button class="btn btn-edit" onclick="editClass(' + item.id + ')"><i class="fas fa-edit"></i> 编辑</button> <button class="btn btn-danger" onclick="deleteClass(' + item.id + ')"><i class="fas fa-trash"></i> 删除</button></td></tr>';
                }
                $("#classTable").html(html);
            }
        });
    }

    function openAddModal() {
        $("#modalTitle").text('新增班级');
        $("#editId").val('');
        $("#gradeYear").val(new Date().getFullYear());
        $("#className").val('');
        $("#modal").css("display", "flex");
    }

    function editClass(id) {
        $.ajax({
            url: "/api/clazz/" + id,
            success: function(res) {
                $("#modalTitle").text('编辑班级');
                $("#editId").val(res.id);
                $("#gradeYear").val(res.gradeYear);
                $("#className").val(res.className);
                $("#modal").css("display", "flex");
            }
        });
    }

    // 使用 $.ajax 完整写法 —— 保存班级
    function saveClass() {
        var id = $("#editId").val();
        var data = {
            gradeYear: $("#gradeYear").val(),
            className: $("#className").val().trim()
        };
        if (!data.className) { alert('请填写班级名称'); return; }
        var url = id ? "/api/clazz/update" : "/api/clazz/add";
        if (id) data.id = id;
        $.ajax({
            url: url,
            type: "POST",
            data: data,
            success: function(res) {
                if (res > 0) {
                    alert(id ? '修改成功' : '新增成功');
                    closeModal();
                    loadClassList();
                } else alert('操作失败');
            }
        });
    }

    // 使用 $.ajax 完整写法 —— 删除班级
    function deleteClass(id) {
        if (!confirm('确定删除该班级吗？')) return;
        $.ajax({
            url: "/api/clazz/" + id,
            type: "DELETE",
            success: function(res) {
                if (res > 0) { alert('删除成功'); loadClassList(); }
                else alert('删除失败');
            }
        });
    }

    function closeModal() { $("#modal").hide(); }
</script>
</body>
</html>
