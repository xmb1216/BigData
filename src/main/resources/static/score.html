<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成绩管理 · 智慧课堂</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: "Inter", "Microsoft Yahei", system-ui, sans-serif; min-height:100vh; background:#0b1120; color:#f1f5f9; overflow-x:hidden; position:relative; }
        .bg-gradient-layer { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; background:radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.25) 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.20) 0%, transparent 50%), radial-gradient(ellipse at 50% 80%, rgba(59,130,246,0.15) 0%, transparent 50%), #0b1120; animation:gradientFlow 18s ease-in-out infinite alternate; }
        @keyframes gradientFlow { 0% { background:radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.30) 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.25) 0%, transparent 50%), radial-gradient(ellipse at 50% 80%, rgba(59,130,246,0.20) 0%, transparent 50%), #0b1120; } 50% { background:radial-gradient(ellipse at 70% 40%, rgba(139,92,246,0.30) 0%, transparent 55%), radial-gradient(ellipse at 20% 70%, rgba(99,102,241,0.25) 0%, transparent 50%), radial-gradient(ellipse at 60% 10%, rgba(59,130,246,0.20) 0%, transparent 45%), #0f172a; } 100% { background:radial-gradient(ellipse at 40% 60%, rgba(59,130,246,0.30) 0%, transparent 55%), radial-gradient(ellipse at 10% 30%, rgba(139,92,246,0.25) 0%, transparent 50%), radial-gradient(ellipse at 80% 70%, rgba(99,102,241,0.20) 0%, transparent 50%), #0b1120; } }
        #particleCanvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events:none; }
        .layout { position:relative; z-index:2; display:flex; min-height:100vh; }
        .sidebar { width:230px; flex-shrink:0; background:rgba(255,255,255,0.04); backdrop-filter:blur(24px) saturate(1.4); -webkit-backdrop-filter:blur(24px) saturate(1.4); border-right:1px solid rgba(255,255,255,0.06); padding:24px 0 30px; display:flex; flex-direction:column; transition:backdrop-filter 0.4s; box-shadow:4px 0 40px rgba(0,0,0,0.3); }
        .sidebar:hover { backdrop-filter:blur(28px) saturate(1.6); }
        .sidebar-logo { padding:0 20px 24px; border-bottom:1px solid rgba(255,255,255,0.06); text-align:center; font-size:18px; font-weight:700; letter-spacing:0.5px; background:linear-gradient(135deg, #a78bfa, #6366f1); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; position:relative; }
        .sidebar-logo::after { content:''; position:absolute; bottom:-1px; left:30%; width:40%; height:2px; background:linear-gradient(90deg, transparent, #8b5cf6, transparent); border-radius:4px; }
        .menu-group { padding:16px 0 4px 20px; font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:rgba(255,255,255,0.25); font-weight:600; }
        .menu-item { display:flex; align-items:center; padding:12px 20px; margin:2px 12px; border-radius:10px; color:rgba(255,255,255,0.5); cursor:pointer; transition:all 0.35s cubic-bezier(0.25,0.46,0.45,0.94); text-decoration:none; font-size:14px; font-weight:500; background:transparent; border:none; }
        .menu-item i { width:22px; font-size:16px; margin-right:12px; transition:transform 0.3s; text-align:center; }
        .menu-item span { transition:transform 0.3s; }
        .menu-item:hover { background:rgba(139,92,246,0.15); color:#fff; transform:translateX(4px) scale(1.02); box-shadow:0 4px 20px rgba(139,92,246,0.10); }
        .menu-item:hover i { transform:scale(1.15) translateX(2px); }
        .menu-item:hover span { transform:translateX(2px); }
        .menu-item.active { background:rgba(139,92,246,0.18); color:#fff; box-shadow:inset 3px 0 0 #8b5cf6, 0 4px 20px rgba(139,92,246,0.08); }
        .menu-item.active i { color:#a78bfa; }
        .badge { margin-left:auto; background:rgba(139,92,246,0.2); padding:2px 10px; border-radius:20px; font-size:11px; color:#a78bfa; font-weight:600; }
        .main { flex:1; padding:28px 32px 40px; min-width:0; }
        .header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:16px; padding:16px 24px; background:rgba(255,255,255,0.04); backdrop-filter:blur(20px) saturate(1.3); -webkit-backdrop-filter:blur(20px) saturate(1.3); border-radius:16px; border:1px solid rgba(255,255,255,0.06); margin-bottom:32px; transition:box-shadow 0.4s, border-color 0.4s; box-shadow:0 8px 32px rgba(0,0,0,0.15); }
        .header:hover { border-color:rgba(139,92,246,0.15); box-shadow:0 8px 40px rgba(0,0,0,0.25); }
        .header-left { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
        .header-title { font-size:20px; font-weight:700; letter-spacing:-0.3px; background:linear-gradient(135deg, #e2e8f0, #94a3b8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .header-title i { -webkit-text-fill-color:initial; color:#8b5cf6; margin-right:8px; }
        .user-info { display:flex; align-items:center; gap:12px; font-size:14px; color:rgba(255,255,255,0.7); flex-wrap:wrap; }
        .user-avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg, #6366f1, #8b5cf6); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:15px; color:#fff; box-shadow:0 0 20px rgba(139,92,246,0.2); border:1px solid rgba(255,255,255,0.08); }
        .logout-btn { padding:7px 18px; border-radius:40px; border:none; font-size:13px; font-weight:500; color:#f1f5f9; cursor:pointer; background:linear-gradient(135deg, rgba(239,68,68,0.15), rgba(239,68,68,0.05)); border:1px solid rgba(239,68,68,0.15); transition:all 0.4s cubic-bezier(0.25,0.46,0.45,0.94); position:relative; overflow:hidden; font-family:inherit; display:inline-flex; align-items:center; gap:6px; }
        .logout-btn::before { content:''; position:absolute; inset:0; border-radius:40px; padding:2px; background:linear-gradient(135deg, #ef4444, #f97316, #ef4444); background-size:300% 300%; -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite:xor; mask-composite:exclude; animation:borderFlow 4s ease-in-out infinite; opacity:0; transition:opacity 0.4s; }
        .logout-btn:hover::before { opacity:1; }
        .logout-btn:hover { background:rgba(239,68,68,0.20); border-color:rgba(239,68,68,0.3); transform:translateY(-2px); box-shadow:0 8px 30px rgba(239,68,68,0.12); }
        .logout-btn:active { transform:scale(0.96); }
        .logout-btn .btn-loader { display:none; width:16px; height:16px; border:2px solid rgba(255,255,255,0.15); border-top-color:#f1f5f9; border-radius:50%; animation:spin 0.7s linear infinite; }
        .logout-btn.loading .btn-loader { display:inline-block; }
        .logout-btn.loading .btn-text { opacity:0.6; }
        @keyframes borderFlow { 0%,100% { background-position:0% 50%; } 50% { background-position:100% 50%; } }
        @keyframes spin { to { transform:rotate(360deg); } }
        .toolbar { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:24px; align-items:center; }
        .toolbar select { height:40px; padding:0 14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:#f1f5f9; outline:none; transition:all 0.3s; font-size:14px; backdrop-filter:blur(4px); }
        .toolbar select:focus { border-color:rgba(139,92,246,0.5); background:rgba(255,255,255,0.07); box-shadow:0 0 0 4px rgba(139,92,246,0.08); }
        .toolbar select option { background:#1e293b; }
        .btn { height:40px; padding:0 20px; border:none; border-radius:10px; cursor:pointer; transition:all 0.3s cubic-bezier(0.25,0.46,0.45,0.94); color:#fff; font-size:14px; font-weight:500; display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.06); }
        .btn-primary { background:linear-gradient(135deg, #6366f1, #8b5cf6); border:none; }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(99,102,241,0.3); }
        .btn-success { background:rgba(34,197,94,0.8); }
        .btn-warning { background:rgba(245,158,11,0.8); }
        .btn-danger { background:rgba(239,68,68,0.8); }
        .btn-edit { background:rgba(59,130,246,0.8); }
        .btn-cancel { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); }
        .btn-cancel:hover { background:rgba(255,255,255,0.15); }

        .stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px; }
        .stat-card { padding:20px; background:rgba(255,255,255,0.03); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-radius:12px; border:1px solid rgba(255,255,255,0.05); text-align:center; transition:all 0.3s; }
        .stat-card:hover { border-color:rgba(139,92,246,0.15); transform:translateY(-2px); }
        .stat-label { font-size:14px; color:rgba(255,255,255,0.6); margin-bottom:8px; }
        .stat-value { font-size:24px; font-weight:700; background:linear-gradient(135deg, #e2e8f0, #94a3b8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

        .chart-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px; }
        .chart-card { padding:16px; background:rgba(255,255,255,0.03); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-radius:16px; border:1px solid rgba(255,255,255,0.05); position:relative; transition:border-color 0.3s; }
        .chart-card:hover { border-color:rgba(139,92,246,0.08); }
        .chart-card-title { font-size:14px; color:rgba(255,255,255,0.7); margin-bottom:8px; font-weight:600; padding-left:4px; border-left:3px solid #8b5cf6; }
        .chart-container { width:100%; height:350px; }
        .chart-empty { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:rgba(255,255,255,0.3); font-size:14px; pointer-events:none; text-align:center; }

        .table-box { background:rgba(255,255,255,0.03); backdrop-filter:blur(20px) saturate(1.2); -webkit-backdrop-filter:blur(20px) saturate(1.2); border-radius:16px; border:1px solid rgba(255,255,255,0.05); overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,0.10); transition:border-color 0.3s; }
        .table-box:hover { border-color:rgba(139,92,246,0.08); }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:14px 18px; text-align:left; border-bottom:1px solid rgba(255,255,255,0.06); font-size:14px; }
        th { background:rgba(139,92,246,0.06); font-weight:600; color:rgba(255,255,255,0.7); letter-spacing:0.3px; }
        tr:hover { background:rgba(255,255,255,0.03); }
        td .btn { height:28px; padding:0 12px; font-size:12px; border-radius:6px; }

        .modal-mask { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); backdrop-filter:blur(8px); z-index:999; align-items:center; justify-content:center; }
        .modal { width:480px; background:rgba(30,41,59,0.85); backdrop-filter:blur(32px) saturate(1.4); -webkit-backdrop-filter:blur(32px) saturate(1.4); border-radius:20px; padding:28px 32px; border:1px solid rgba(255,255,255,0.08); box-shadow:0 20px 60px rgba(0,0,0,0.5); max-height:85vh; overflow-y:auto; }
        .modal-title { font-size:20px; font-weight:600; margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid rgba(255,255,255,0.06); color:#e2e8f0; }
        .form-item { margin-bottom:18px; }
        .form-item label { display:block; margin-bottom:8px; font-size:14px; color:rgba(255,255,255,0.7); font-weight:500; }
        .form-item input, .form-item select { width:100%; height:44px; padding:0 14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:#f1f5f9; outline:none; transition:all 0.3s; font-size:14px; }
        .form-item input:focus, .form-item select:focus { border-color:rgba(139,92,246,0.5); background:rgba(255,255,255,0.07); box-shadow:0 0 0 4px rgba(139,92,246,0.08); }
        .form-item select option { background:#1e293b; }
        .modal-footer { display:flex; justify-content:flex-end; gap:12px; margin-top:24px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.06); }

        .rank-table { width:100%; border-collapse:collapse; margin-top:10px; }
        .rank-table th, .rank-table td { padding:10px; text-align:center; border-bottom:1px solid rgba(255,255,255,0.05); }

        @media (max-width:1024px) { .chart-grid { grid-template-columns:1fr; } .stat-grid { grid-template-columns:repeat(2,1fr); } .chart-container { height:280px; } }
        @media (max-width:640px) { .stat-grid { grid-template-columns:1fr; } .chart-container { height:240px; } .sidebar { width:70px; padding:16px 0; } .sidebar-logo { font-size:0; padding:0 0 16px; } .sidebar-logo::after { display:none; } .menu-group { display:none; } .menu-item { padding:12px 0; justify-content:center; margin:2px 6px; } .menu-item span { display:none; } .menu-item i { margin:0; font-size:18px; } .badge { display:none; } .main { padding:16px; } .header { padding:14px 18px; flex-direction:column; align-items:stretch; } .header-left { flex-wrap:wrap; } }
        @media (max-width:480px) { .modal { width:95%; padding:20px; } }
    </style>
</head>
<body>
<div class="bg-gradient-layer"></div>
<canvas id="particleCanvas"></canvas>

<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-logo">✦智慧课堂管理系统✦</div>
        <div class="menu-group">导航</div>
        <a href="/index" class="menu-item"><i class="fas fa-home"></i><span>系统首页</span></a>
        <a href="student.html" class="menu-item"><i class="fas fa-user-graduate"></i><span>学生管理</span></a>
        <a href="class.html" class="menu-item"><i class="fas fa-users"></i><span>班级管理</span></a>
        <a href="course.html" class="menu-item"><i class="fas fa-book"></i><span>课程管理</span></a>
        <a href="exam.html" class="menu-item"><i class="fas fa-file-alt"></i><span>考试管理</span></a>
        <a href="score.html" class="menu-item active"><i class="fas fa-chart-bar"></i><span>成绩管理</span></a>
    </aside>

    <main class="main">
        <header class="header">
            <div class="header-left">
                <div class="header-title"><i class="fas fa-chart-bar"></i> 成绩管理</div>
            </div>
            <div class="user-info">
                <div class="user-avatar">A</div>
                <button class="logout-btn" id="logoutBtn" onclick="handleLogout()">
                    <span class="btn-text"><i class="fas fa-sign-out-alt"></i> 退出</span>
                    <span class="btn-loader"></span>
                </button>
            </div>
        </header>

        <!-- 工具栏 -->
        <div class="toolbar">
            <select id="examSelect"><option value="">请选择考试</option></select>
            <select id="classSelect"><option value="">请选择班级</option></select>
            <select id="courseSelect"><option value="">请选择课程</option></select>
            <button class="btn btn-primary" onclick="loadScoreList()"><i class="fas fa-search"></i> 查询成绩</button>
            <button class="btn btn-warning" onclick="loadRank()"><i class="fas fa-trophy"></i> 总分排名</button>
            <button class="btn btn-primary" onclick="openAddModal()"><i class="fas fa-plus"></i> 新增成绩</button>
        </div>



        <!-- 图表区域，默认隐藏，查询后显示 -->
        <div class="chart-grid" id="chartGrid" style="display:none;">
            <div class="chart-card">
                <div class="chart-card-title">📊 成绩分布统计</div>
                <div class="chart-container" id="barChart"></div>
                <div class="chart-empty" id="barChartEmpty">请查询成绩后查看分布</div>
            </div>
            <div class="chart-card">
                <div class="chart-card-title">📊 分数段占比</div>
                <div class="chart-container" id="pieChart"></div>
                <div class="chart-empty" id="pieChartEmpty">请查询成绩后查看占比</div>
            </div>
        </div>

        <!-- 成绩表格 -->
        <div class="table-box">
            <table>
                <thead><tr>
                    <th>ID</th>
                    <th>学生姓名</th>
                    <th>课程</th>
                    <th>分数</th>
                    <th>操作</th>
                </tr></thead>
                <!--动态渲染容器，初始默认占位提示文字；AJAX 查询成绩后用 JS 拼接 HTML 覆盖内部内容-->
                <tbody id="scoreTable">
                <tr>
                    <td colspan="5" style="text-align:center;color:rgba(255,255,255,.4);">请选择考试、班级、课程后查询成绩</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- 新增/编辑弹窗 -->
<div class="modal-mask" id="modal">
    <div class="modal">
        <div class="modal-title" id="modalTitle">新增成绩</div>
        <input type="hidden" id="editId">
        <div class="form-item">
            <label>选择考试</label>
            <select id="modalExam"></select>
        </div>
        <div class="form-item">
            <label>选择班级</label>
            <select id="modalClass" onchange="loadStudentByClass()"></select>
        </div>
        <div class="form-item">
            <label>选择学生</label>
            <select id="modalStudent"></select>
        </div>
        <div class="form-item">
            <label>选择课程</label>
            <select id="modalCourse"></select>
        </div>
        <div class="form-item">
            <label>考试分数</label>
            <input type="number" id="modalScore" step="0.01" placeholder="请输入分数">

        <div class="modal-footer">
            <button class="btn btn-cancel" onclick="closeModal()">取消</button>

</div>


<!-- 排名弹窗  -->
<div class="modal-mask" id="rankModal">
    <div class="modal" style="width:620px;max-width:95vw;">
        <div class="modal-title">🏆 班级总分排名</div>
        <table class="rank-table"><thead>
        <tr>
            <th>排名</th>
            <th>学生ID</th>
            <th>总分</th>
        </tr>
        </thead>
            <tbody id="rankTableBody"></tbody>
        </table>
        <div class="modal-footer"><button class="btn btn-cancel" onclick="closeRankModal()">关闭</button></div>
    </div>
</div>




<!--JS 外部依赖引入-->
<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>

    // ─── 退出登录 ───
    function handleLogout() {
        var btn = document.getElementById('logoutBtn');
        if (btn.classList.contains('loading')) return;
        if (!confirm('确定退出登录吗？')) return;
        btn.classList.add('loading');
        btn.disabled = true;
        setTimeout(function() { location.href = '/logout'; }, 1200);
    }

    // ─── 全局变量 ───
    var examList = [], classList = [], courseList = [], studentList = [];
    var barChartInstance = null, pieChartInstance = null;

    // ─── 工具函数 ───
    function debounce(fn, delay) {
        var timer;
        return function() {
            clearTimeout(timer);
            timer = setTimeout(function() { fn.apply(this, arguments); }, delay);
        };
    }
    //防抖 debounce
    function resizeAllCharts() {
        if (barChartInstance && !barChartInstance.isDisposed()) barChartInstance.resize();
        if (pieChartInstance && !pieChartInstance.isDisposed()) pieChartInstance.resize();
    }

    //图表空白提示控制函数
    function hideBarChartEmpty(hasData) {
        document.getElementById('barChartEmpty').style.display = hasData ? 'none' : 'block';
        document.getElementById('barChart').style.display = hasData ? 'block' : 'none';
    }
    function hidePieChartEmpty(hasData) {
        document.getElementById('pieChartEmpty').style.display = hasData ? 'none' : 'block';
        document.getElementById('pieChart').style.display = hasData ? 'block' : 'none';
    }

    // ─── 加载基础数据（考试、班级、课程） ───
    $(function() {
        $.ajax({
            url: '/api/exam/list',
            success: function(result) {
                examList = result;
                var html = '<option value="">请选择考试</option>';
                var modalHtml = '';
                for (var i = 0; i < result.length; i++) {
                    html += '<option value="' + result[i].id + '">' + result[i].examName + ' (' + result[i].schoolYear + ')</option>';
                    modalHtml += '<option value="' + result[i].id + '">' + result[i].examName + ' (' + result[i].schoolYear + ')</option>';
                }
                document.getElementById('examSelect').innerHTML = html;
                document.getElementById('modalExam').innerHTML = modalHtml;
            }
        });

        $.ajax({
            url: '/api/clazz/list',
            success: function(result) {
                classList = result;
                var html = '<option value="">请选择班级</option>';
                var modalHtml = '';
                for (var i = 0; i < result.length; i++) {
                    html += '<option value="' + result[i].id + '">' + result[i].className + '</option>';
                    modalHtml += '<option value="' + result[i].id + '">' + result[i].className + '</option>';
                }
                document.getElementById('classSelect').innerHTML = html;
                document.getElementById('modalClass').innerHTML = modalHtml;
            }
        });

        $.ajax({
            url: '/api/course/list',
            success: function(result) {
                courseList = result;
                var html = '<option value="">请选择课程</option>';
                var modalHtml = '';
                for (var i = 0; i < result.length; i++) {
                    html += '<option value="' + result[i].id + '">' + result[i].courseName + '</option>';
                    modalHtml += '<option value="' + result[i].id + '">' + result[i].courseName + '</option>';
                }
                document.getElementById('courseSelect').innerHTML = html;
                document.getElementById('modalCourse').innerHTML = modalHtml;
            }
        });

        $(window).on('resize', debounce(function() { resizeAllCharts(); }, 300));
    });



    // ─── 根据班级加载学生 ───
    function loadStudentByClass() {
        var classId = document.getElementById('modalClass').value;
        if (!classId) {
            document.getElementById('modalStudent').innerHTML = '<option value="">请先选择班级</option>';
            return;
        }
        $.ajax({
            url: '/api/student/class/' + classId,
            success: function(result) {
                studentList = result;
                var html = '';
                for (var i = 0; i < result.length; i++) {
                    html += '<option value="' + result[i].id + '">' + result[i].name + ' (' + (result[i].studentNo || '') + ')</option>';
                }
                document.getElementById('modalStudent').innerHTML = html;
            }
        });
    }



    // ─── 计算分数段分布 ───
    function calcScoreDistribution(scoreList) {
        var dist = [
            { name: '不及格 (<60)', range: '<60', min: 0, max: 59, count: 0, color: '#ef4444' },
            { name: '及格 (60-69)', range: '60-69', min: 60, max: 69, count: 0, color: '#f59e0b' },
            { name: '中等 (70-79)', range: '70-79', min: 70, max: 79, count: 0, color: '#3b82f6' },
            { name: '良好 (80-89)', range: '80-89', min: 80, max: 89, count: 0, color: '#6366f1' },
            { name: '优秀 (90-100)', range: '90-100', min: 90, max: 100, count: 0, color: '#22c55e' }
        ];
        for (var i = 0; i < scoreList.length; i++) {
            var score = parseFloat(scoreList[i].score);
            if (isNaN(score)) continue;
            for (var j = 0; j < dist.length; j++) {
                if (score >= dist[j].min && score <= dist[j].max) {
                    dist[j].count++;
                    break;
                }
            }
        }
        return dist;
    }

    // ─── 渲染柱状图（基础示例风格） ───
    function renderBarChart(dist) {
        var dom = document.getElementById('barChart');
        if (!dom) return;
        hideBarChartEmpty(true);
        if (!barChartInstance || barChartInstance.isDisposed()) {
            barChartInstance = echarts.init(dom);
        }

        var categories = [];
        var data = [];
        for (var i = 0; i < dist.length; i++) {
            categories.push(dist[i].name);
            data.push(dist[i].count);
        }

        var option = {
            xAxis: {
                type: 'category',
                data: categories,
                axisLabel: { color: '#f1f5f9' },
                axisLine: { lineStyle: { color: 'rgba(255,255,255,0.2)' } }
            },
            yAxis: {
                type: 'value',
                axisLabel: { color: '#f1f5f9' },
                axisLine: { lineStyle: { color: 'rgba(255,255,255,0.2)' } },
                splitLine: { lineStyle: { color: 'rgba(255,255,255,0.08)' } }
            },
            series: [
                { data: data, type: 'bar' }
            ]
        };

        barChartInstance.setOption(option, true);
    }
  // ─── 渲染饼图（基础示例风格） ───
    function renderPieChart(dist) {
        var dom = document.getElementById('pieChart');
        if (!dom) return;
        hidePieChartEmpty(true);
        if (!pieChartInstance || pieChartInstance.isDisposed()) {
            pieChartInstance = echarts.init(dom);
        }

        var pieData = [];
        var total = 0;
        for (var i = 0; i < dist.length; i++) {
            total += dist[i].count;
        }

        if (total === 0) {
            pieData.push({ value: 1, name: '暂无数据' });
        } else {
            for (var i = 0; i < dist.length; i++) {
                if (dist[i].count > 0) {
                    pieData.push({
                        value: dist[i].count,
                        name: dist[i].name
                    });
                }
            }
        }

        var option = {
            tooltip: {
                trigger: 'item',
                backgroundColor: 'rgba(30,41,59,0.95)',
                textStyle: { color: '#ffffff' }
            },
            legend: {
                orient: 'vertical',
                left: 'left',
                textStyle: { color: '#f1f5f9', fontSize: 14 }
            },
            series: [
                {
                    name: '分数段占比',
                    type: 'pie',
                    radius: '50%',
                    data: pieData,
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowOffsetX: 0,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    }
                }
            ]
        };

        pieChartInstance.setOption(option, true);
    }


    // ─── 渲染分布图表 ───
    function renderDistributionCharts(scoreList) {
        var dist = calcScoreDistribution(scoreList);
        document.getElementById('chartGrid').style.display = 'grid';
        renderBarChart(dist);
        renderPieChart(dist);
    }

    // ─── 查询成绩列表 ───
    function loadScoreList() {
        var examId = document.getElementById('examSelect').value;
        var classId = document.getElementById('classSelect').value;
        var courseId = document.getElementById('courseSelect').value;
        if (!examId || !classId || !courseId) {
            alert('请选择考试、班级、课程');
            return;
        }

        $.ajax({
            url: '/api/score/list',
            data: { examId: examId, classId: classId, courseId: courseId },
            success: function(result) {
                console.log('成绩数据:', result);

                var courseMap = {};
                for (var i = 0; i < courseList.length; i++) {
                    courseMap[courseList[i].id] = courseList[i].courseName;
                }

                var tbody = document.getElementById('scoreTable');
                if (result.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:rgba(255,255,255,.4);">暂无成绩数据</td></tr>';
                    document.getElementById('chartGrid').style.display = 'none';
                    if (barChartInstance) barChartInstance.clear();
                    if (pieChartInstance) pieChartInstance.clear();
                    return;
                }

                var str = '';
                for (var i = 0; i < result.length; i++) {
                    var item = result[i];

                    var studentName = '-';
                    if (item.studentName !== undefined && item.studentName !== null && item.studentName !== '') {
                        studentName = item.studentName;
                    } else if (item.student_name !== undefined && item.student_name !== null && item.student_name !== '') {
                        studentName = item.student_name;
                    } else if (item.student && item.student.name) {
                        studentName = item.student.name;
                    }

                    var courseName = '-';
                    if (item.courseName !== undefined && item.courseName !== null && item.courseName !== '') {
                        courseName = item.courseName;
                    } else if (item.course_name !== undefined && item.course_name !== null && item.course_name !== '') {
                        courseName = item.course_name;
                    } else if (item.course && item.course.name) {
                        courseName = item.course.name;
                    } else if (item.courseId !== undefined && item.courseId !== null) {
                        var cid = item.courseId;
                        if (courseMap[cid]) courseName = courseMap[cid];
                    } else if (item.course_id !== undefined && item.course_id !== null) {
                        var cid2 = item.course_id;
                        if (courseMap[cid2]) courseName = courseMap[cid2];
                    }

                    if (courseName === '-') {
                        var debugId = item.courseId || item.course_id || '';
                        courseName = '(课程ID:' + debugId + ')';
                    }

                    str += '<tr>'
                        + '<td>' + item.id + '</td>'
                        + '<td>' + studentName + '</td>'
                        + '<td>' + courseName + '</td>'
                        + '<td>' + item.score + '</td>'
                        + '<td>'
                        + '<button class="btn btn-edit" onclick="editScore(' + item.id + ')"><i class="fas fa-edit"></i> 编辑</button> '
                        + '<button class="btn btn-danger" onclick="deleteScore(' + item.id + ')"><i class="fas fa-trash"></i> 删除</button>'
                        + '</td>'
                        + '</tr>';
                }
                tbody.innerHTML = str;
                renderDistributionCharts(result);
            }
        });
    }

    // ─── 总分排名（仅表格，无图表） ───
    function loadRank() {

    // ─── 新增成绩弹窗 ───
    function openAddModal() {
        document.getElementById('modalTitle').textContent = '新增成绩';
        document.getElementById('editId').value = '';
        document.getElementById('modalExam').value = examList.length > 0 ? examList[0].id : '';
        document.getElementById('modalClass').value = classList.length > 0 ? classList[0].id : '';
        loadStudentByClass();
        document.getElementById('modalCourse').value = courseList.length > 0 ? courseList[0].id : '';
        document.getElementById('modalScore').value = '';

    // ─── 编辑成绩 ───
    function editScore(id) {
        document.getElementById('modalTitle').textContent = '编辑成绩';
        document.getElementById('editId').value = id;
        alert('编辑功能仅支持修改分数，如需修改其他信息请删除后重新录入');
        document.getElementById('modal').style.display = 'flex';
    }

    // ─── 保存成绩 ───
    function saveScore() {
        var id = document.getElementById('editId').value;
        var data = {
            examId: document.getElementById('modalExam').value,
            studentId: document.getElementById('modalStudent').value,
            courseId: document.getElementById('modalCourse').value,
            classId: document.getElementById('modalClass').value,
            score: document.getElementById('modalScore').value
        };
        if (!data.examId || !data.classId || !data.studentId || !data.courseId || !data.score) {
            alert('请填写完整信息');
            return;
        }

        var url = id ? '/api/score/update' : '/api/score/add';
        if (id) data.id = id;

        $.ajax({
            url: url,
            type: 'POST',
            data: data,
            success: function(result) {
                if (result > 0) {
                    alert(id ? '修改成功' : '新增成功');
                    closeModal();
                    loadScoreList();
                } else {
                    alert('操作失败，可能存在重复成绩记录');
                }
            }
        });
    }

    // ─── 删除成绩 ───
    function deleteScore(id) {
        if (!confirm('确定删除该成绩吗？')) return;
        $.ajax({
            url: '/api/score/' + id,
            type: 'DELETE',
            success: function(result) {
                if (result > 0) {
                    alert('删除成功');
                    loadScoreList();
                } else {
                    alert('删除失败');
                }
                cx();
            }
        });
    }

    // ─── 关闭弹窗 ───
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function closeRankModal() {
        document.getElementById('rankModal').style.display = 'none';
    }





    // ─── 页面卸载释放图表 ───
    $(window).on('beforeunload', function() {
        if (barChartInstance && !barChartInstance.isDisposed()) barChartInstance.dispose();
        if (pieChartInstance && !pieChartInstance.isDisposed()) pieChartInstance.dispose();
    });




    // ─── 粒子网络 ───
    (function initParticles() {
        var canvas = document.getElementById('particleCanvas');
        var ctx = canvas.getContext('2d');
        var width, height, particles = [];
        var COUNT = 80, CONNECT = 140, RADIUS = 160;
        var mouse = { x: null, y: null };

        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function Particle() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.4;
            this.vy = (Math.random() - 0.5) * 0.4;
            this.r = Math.random() * 2.2 + 1.2;
            this.o = Math.random() * 0.5 + 0.2;
        }
        Particle.prototype.update = function() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0 || this.x > width) this.vx *= -1;
            if (this.y < 0 || this.y > height) this.vy *= -1;
            if (mouse.x !== null && mouse.y !== null) {
                var dx = mouse.x - this.x, dy = mouse.y - this.y, dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < RADIUS) {
                    var force = (RADIUS - dist) / RADIUS * 0.012;
                    this.vx += dx * force;
                    this.vy += dy * force;
                    var sp = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    if (sp > 0.8) { this.vx = (this.vx / sp) * 0.8; this.vy = (this.vy / sp) * 0.8; }
                }
            }
        };
        Particle.prototype.draw = function() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(167,139,250,' + this.o + ')';
            ctx.fill();
        };

        for (var i = 0; i < COUNT; i++) { particles.push(new Particle()); }

        window.addEventListener('mousemove', function(e) { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseleave', function() { mouse.x = null; mouse.y = null; });
        window.addEventListener('touchmove', function(e) { var t = e.touches[0]; mouse.x = t.clientX; mouse.y = t.clientY; }, { passive: true });
        window.addEventListener('touchend', function() { mouse.x = null; mouse.y = null; });

        function drawLines() {
            for (var i = 0; i < particles.length; i++) {
                for (var j = i + 1; j < particles.length; j++) {
                    var dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONNECT) {
                        var alpha = (1 - dist / CONNECT) * 0.25;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = 'rgba(167,139,250,' + alpha + ')';
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            for (var i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            drawLines();
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', function() {
            resize();
            for (var i = 0; i < particles.length; i++) {
                particles[i].x = Math.random() * width;
                particles[i].y = Math.random() * height;
            }
        });
    })();
