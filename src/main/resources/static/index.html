<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学生成绩管理系统 · 仪表板</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ── 全局重置 ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Inter", "Microsoft Yahei", system-ui, sans-serif;
            min-height: 100vh;
            background: #0b1120;
            color: #f1f5f9;
            overflow-x: hidden;
            position: relative;
        }

        /* ── 动态背景层：流动渐变 ── */
        .bg-gradient-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.25) 0%, transparent 60%),
            radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.20) 0%, transparent 50%),
            radial-gradient(ellipse at 50% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
            #0b1120;
            animation: gradientFlow 18s ease-in-out infinite alternate;
        }
        @keyframes gradientFlow {
            0% {
                background: radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.30) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(59, 130, 246, 0.20) 0%, transparent 50%),
                #0b1120;
            }
            50% {
                background: radial-gradient(ellipse at 70% 40%, rgba(139, 92, 246, 0.30) 0%, transparent 55%),
                radial-gradient(ellipse at 20% 70%, rgba(99, 102, 241, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 10%, rgba(59, 130, 246, 0.20) 0%, transparent 45%),
                #0f172a;
            }
            100% {
                background: radial-gradient(ellipse at 40% 60%, rgba(59, 130, 246, 0.30) 0%, transparent 55%),
                radial-gradient(ellipse at 10% 30%, rgba(139, 92, 246, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(99, 102, 241, 0.20) 0%, transparent 50%),
                #0b1120;
            }
        }

        /* ── Canvas 粒子网络 ── */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            display: block;
        }

        /* ── 主布局（在背景之上） ── */
        .layout {
            position: relative;
            z-index: 2;
            display: flex;
            min-height: 100vh;
        }

        /* ── 侧边栏 · 毛玻璃 ── */
        .sidebar {
            width: 230px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            padding: 24px 0 30px;
            display: flex;
            flex-direction: column;
            transition: backdrop-filter 0.4s;
            box-shadow: 4px 0 40px rgba(0, 0, 0, 0.3);
        }
        .sidebar:hover {
            backdrop-filter: blur(28px) saturate(1.6);
        }
        .sidebar-logo {
            padding: 0 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #a78bfa, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }
        .sidebar-logo::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 30%;
            width: 40%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #8b5cf6, transparent);
            border-radius: 4px;
        }
        .sidebar .menu-group {
            padding: 16px 0 4px 20px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 600;
        }
        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            margin: 2px 12px;
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            position: relative;
            background: transparent;
            border: none;
            width: auto;
        }
        .menu-item i {
            width: 22px;
            font-size: 16px;
            margin-right: 12px;
            transition: transform 0.3s;
            text-align: center;
        }
        .menu-item span {
            transition: transform 0.3s;
        }
        .menu-item:hover {
            background: rgba(139, 92, 246, 0.15);
            color: #fff;
            transform: translateX(4px) scale(1.02);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.10);
        }
        .menu-item:hover i {
            transform: scale(1.15) translateX(2px);
        }
        .menu-item:hover span {
            transform: translateX(2px);
        }
        .menu-item.active {
            background: rgba(139, 92, 246, 0.18);
            color: #fff;
            box-shadow: inset 3px 0 0 #8b5cf6, 0 4px 20px rgba(139, 92, 246, 0.08);
        }
        .menu-item.active i {
            color: #a78bfa;
        }
        .menu-item .badge {
            margin-left: auto;
            background: rgba(139, 92, 246, 0.2);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #a78bfa;
            font-weight: 600;
        }

        /* ── 主内容区 ── */
        .main {
            flex: 1;
            padding: 28px 32px 40px;
            min-width: 0;
        }

        /* ── 顶部导航 · 毛玻璃 ── */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px) saturate(1.3);
            -webkit-backdrop-filter: blur(20px) saturate(1.3);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 32px;
            transition: box-shadow 0.4s, border-color 0.4s;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }
        .header:hover {
            border-color: rgba(139, 92, 246, 0.15);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.25);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .header-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-title i {
            -webkit-text-fill-color: initial;
            color: #8b5cf6;
            margin-right: 8px;
        }

        /* ── 搜索框 · 聚焦光晕 ── */
        .search-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-wrap i {
            position: absolute;
            left: 14px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 14px;
            transition: color 0.4s;
            pointer-events: none;
        }
        .search-input {
            padding: 8px 16px 8px 42px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #f1f5f9;
            font-size: 14px;
            width: 220px;
            transition: all 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            outline: none;
            font-family: inherit;
            backdrop-filter: blur(4px);
        }
        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-weight: 300;
        }
        .search-input:focus {
            width: 280px;
            border-color: rgba(139, 92, 246, 0.5);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.08), 0 0 40px rgba(139, 92, 246, 0.05);
        }
        .search-input:focus+i {
            color: #a78bfa;
        }
        /* 底部高亮滑动线 */
        .search-wrap .highlight-line {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #6366f1, #a78bfa, #6366f1);
            border-radius: 4px;
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform: translateX(-50%);
            opacity: 0;
        }
        .search-input:focus~.highlight-line {
            width: 60%;
            opacity: 1;
        }

        /* ── 用户信息 ── */
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            flex-wrap: wrap;
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 15px;
            color: #fff;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* ── 退出登录按钮 · 流动渐变 ── */
        .logout-btn {
            padding: 7px 18px;
            border-radius: 40px;
            border: none;
            font-size: 13px;
            font-weight: 500;
            color: #f1f5f9;
            cursor: pointer;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(239, 68, 68, 0.05));
            border: 1px solid rgba(239, 68, 68, 0.15);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .logout-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 40px;
            padding: 2px;
            background: linear-gradient(135deg, #ef4444, #f97316, #ef4444);
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: borderFlow 4s ease-in-out infinite;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .logout-btn:hover::before {
            opacity: 1;
        }
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.20);
            border-color: rgba(239, 68, 68, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(239, 68, 68, 0.12);
        }
        .logout-btn:active {
            transform: scale(0.96);
        }
        .logout-btn .btn-loader {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: #f1f5f9;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .logout-btn.loading .btn-loader {
            display: inline-block;
        }
        .logout-btn.loading .btn-text {
            opacity: 0.6;
        }
        @keyframes borderFlow {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── 数据卡片网格 ── */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        /* ── 统计卡片 · 毛玻璃 ── */
        .stat-card {
            padding: 24px 22px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px) saturate(1.2);
            -webkit-backdrop-filter: blur(20px) saturate(1.2);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: default;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .stat-card:hover {
            transform: translateY(-6px) scale(1.01);
            border-color: rgba(139, 92, 246, 0.15);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.25), 0 0 40px rgba(139, 92, 246, 0.03);
            background: rgba(255, 255, 255, 0.06);
        }
        .stat-card:hover::before {
            opacity: 1;
        }
        .stat-card .stat-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(139, 92, 246, 0.10);
            color: #a78bfa;
            font-size: 18px;
            margin-bottom: 14px;
            transition: all 0.4s;
        }
        .stat-card:hover .stat-icon {
            background: rgba(139, 92, 246, 0.18);
            transform: scale(1.05) rotate(-4deg);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.05);
        }
        .stat-title {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 500;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #e2e8f0, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .stat-card .stat-sub {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stat-card .stat-sub i {
            font-size: 10px;
        }

        /* 卡片各自强调色 */
        .stat-card:nth-child(1) .stat-icon {
            color: #818cf8;
            background: rgba(99, 102, 241, 0.12);
        }
        .stat-card:nth-child(2) .stat-icon {
            color: #34d399;
            background: rgba(52, 211, 153, 0.10);
        }
        .stat-card:nth-child(3) .stat-icon {
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.10);
        }
        .stat-card:nth-child(4) .stat-icon {
            color: #f472b6;
            background: rgba(244, 114, 182, 0.10);
        }

        /* ── 欢迎区域 · 毛玻璃 ── */
        .welcome {
            padding: 28px 32px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px) saturate(1.2);
            -webkit-backdrop-filter: blur(20px) saturate(1.2);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            transition: border-color 0.4s, box-shadow 0.4s;
        }
        .welcome:hover {
            border-color: rgba(139, 92, 246, 0.08);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.15);
        }
        .welcome h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .welcome h2 i {
            -webkit-text-fill-color: initial;
            color: #8b5cf6;
            margin-right: 8px;
        }
        .welcome p {
            color: rgba(255, 255, 255, 0.4);
            line-height: 1.9;
            font-size: 14px;
            max-width: 680px;
        }
        .welcome .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }
        .welcome .tags span {
            padding: 4px 14px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
        }
        .welcome .tags span:hover {
            background: rgba(139, 92, 246, 0.08);
            border-color: rgba(139, 92, 246, 0.1);
            color: rgba(255, 255, 255, 0.6);
        }

        /* ── 响应式 ── */
        @media (max-width: 820px) {
            .sidebar {
                width: 70px;
                padding: 16px 0;
            }
            .sidebar-logo {
                font-size: 0;
                padding: 0 0 16px;
            }
            .sidebar-logo::after {
                display: none;
            }
            .sidebar .menu-group {
                display: none;
            }
            .menu-item {
                padding: 12px 0;
                justify-content: center;
                margin: 2px 6px;
                border-radius: 10px;
            }
            .menu-item span {
                display: none;
            }
            .menu-item i {
                margin: 0;
                font-size: 18px;
            }
            .menu-item .badge {
                display: none;
            }
            .main {
                padding: 16px;
            }
            .header {
                padding: 14px 18px;
                flex-direction: column;
                align-items: stretch;
            }
            .header-left {
                flex-wrap: wrap;
            }
            .search-input {
                width: 160px;
            }
            .search-input:focus {
                width: 200px;
            }
            .card-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .stat-value {
                font-size: 26px;
            }
            .user-info .user-name {
                display: none;
            }
        }
        @media (max-width: 480px) {
            .card-grid {
                grid-template-columns: 1fr;
            }
            .header-title {
                font-size: 17px;
            }
            .search-input {
                width: 140px;
                font-size: 13px;
                padding: 6px 12px 6px 34px;
            }
            .search-input:focus {
                width: 100%;
            }
            .search-wrap i {
                left: 10px;
                font-size: 12px;
            }
            .welcome {
                padding: 20px;
            }
            .welcome h2 {
                font-size: 17px;
            }
        }

        /* ── 工具类 ── */
        .glow-text {
            text-shadow: 0 0 40px rgba(139, 92, 246, 0.05);
        }
        .fade-in {
            animation: fadeUp 0.8s ease forwards;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .delay-1 {
            animation-delay: 0.05s;
        }
        .delay-2 {
            animation-delay: 0.10s;
        }
        .delay-3 {
            animation-delay: 0.15s;
        }
        .delay-4 {
            animation-delay: 0.20s;
        }
    </style>
</head>
<body>

<!-- 流动渐变背景层 -->
<div class="bg-gradient-layer"></div>

<!-- Canvas 粒子网络 -->
<canvas id="particleCanvas"></canvas>

<!-- ===== 主布局 ===== -->
<div class="layout">

    <!-- 侧边栏 -->
    <aside class="sidebar">
        <div class="sidebar-logo">✦智慧课堂管理系统✦</div>
        <div class="menu-group">导航</div>
        <a href="/index" class="menu-item active"><i class="fas fa-home"></i><span>系统首页</span></a>
        <a href="student.html" class="menu-item"><i class="fas fa-user-graduate"></i><span>学生管理</span></a>
        <a href="class.html" class="menu-item"><i class="fas fa-users"></i><span>班级管理</span></a>
        <a href="course.html" class="menu-item"><i class="fas fa-book"></i><span>课程管理</span></a>
        <a href="exam.html" class="menu-item"><i class="fas fa-file-alt"></i><span>考试管理</span></a>
        <a href="score.html" class="menu-item"><i class="fas fa-chart-bar"></i><span>成绩管理</span></a>
    </aside>

    <!-- 主内容 -->
    <main class="main">

        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-left">
                <div class="header-title">
                    <i class="fas fa-chart-pie"></i> 数据概览
                </div>
            </div>
            <div class="user-info">

                <div class="user-avatar">A</div>
                <button class="logout-btn" id="logoutBtn" onclick="handleLogout()">
                    <span class="btn-text"><i class="fas fa-sign-out-alt"></i> 退出</span>
                    <span class="btn-loader"></span>
                </button>
            </div>
        </header>

        <!-- 数据卡片 -->
        <div class="card-grid">
            <div class="stat-card fade-in delay-1">
                <div class="stat-icon"><i class="fas fa-user-graduate"></i></div>
                <div class="stat-title">学生总数</div>
                <div class="stat-value" id="studentCount">--</div>

            </div>
            <div class="stat-card fade-in delay-2">
                <div class="stat-icon"><i class="fas fa-users"></i></div>
                <div class="stat-title">班级总数</div>
                <div class="stat-value" id="classCount">--</div>

                <div class="stat-value" id="courseCount">--</div>

            <div class="stat-card fade-in delay-4">
                <div class="stat-icon"><i class="fas fa-file-alt"></i></div>

        <div class="welcome fade-in">

                左侧导航栏可进入对应模块进行数据维护与查询分析。

<!-- ===== 脚本 ===== -->
<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js">
</script>
<script>
    // ─── Canvas 粒子网络 ───
    (function initParticles() {
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        const PARTICLE_COUNT = 80;
        const CONNECT_DIST = 140;
        const MOUSE_RADIUS = 160;

        let mouse = { x: null, y: null };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.radius = Math.random() * 2.2 + 1.2;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
                // 鼠标吸引
                if (mouse.x !== null && mouse.y !== null) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < MOUSE_RADIUS) {
                        const force = (MOUSE_RADIUS - dist) / MOUSE_RADIUS * 0.012;
                        this.vx += dx * force;
                        this.vy += dy * force;
                        // 限制速度
                        const sp = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                        if (sp > 0.8) {
                            this.vx = (this.vx / sp) * 0.8;
                            this.vy = (this.vy / sp) * 0.8;
                        }
                    }
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(167, 139, 250, ${this.opacity})`;
                ctx.fill();
            }
        }

        // 初始化粒子
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle());
        }

        // 鼠标追踪
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // 触摸支持
        window.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            mouse.x = t.clientX;
            mouse.y = t.clientY;
        }, { passive: true });
        window.addEventListener('touchend', () => {
            mouse.x = null;
            mouse.y = null;
        });

        function drawLines() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONNECT_DIST) {
                        const alpha = (1 - dist / CONNECT_DIST) * 0.25;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(167, 139, 250, ${alpha})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            // 绘制每个粒子
            for (const p of particles) {
                p.update();
                p.draw();
            }
            drawLines();
            requestAnimationFrame(animate);
        }
        animate();

        // 窗口变化重新调整粒子位置
        window.addEventListener('resize', () => {
            resize();
            // 重新分布粒子
            for (const p of particles) {
                p.x = Math.random() * width;
                p.y = Math.random() * height;
            }
        });
    })();

    // ─── 退出登录（带加载动效） ───
    function handleLogout() {
        const btn = document.getElementById('logoutBtn');
        if (btn.classList.contains('loading')) return;
        if (!confirm('确定退出登录吗？')) return;

        btn.classList.add('loading');
        btn.disabled = true;

        // 模拟加载 1.2s 后跳转
        setTimeout(() => {
            location.href = '/logout';
        }, 1200);
    }

    // ─── 加载统计数据 ───
    $(function() {
        // 学生数
        $.get('/api/student/list', function(res) {
            $('#studentCount').text(res.length || 0);
        }).fail(function() {
            $('#studentCount').text('—');
        });

        // 班级数
        $.get('/api/clazz/list', function(res) {
            $('#classCount').text(res.length || 0);
        }).fail(function() {
            $('#classCount').text('—');
        });

        // 课程数
        $.get('/api/course/list', function(res) {
            $('#courseCount').text(res.length || 0);
        }).fail(function() {
            $('#courseCount').text('—');
        });

        // 考试数
        $.get('/api/exam/list', function(res) {
            $('#examCount').text(res.length || 0);
        }).fail(function() {
            $('#examCount').text('—');
        });


    });
</script>

</body>
</html>
